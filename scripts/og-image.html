<!doctype html>
<!-- Template for public/og-image.png (1200x630). Regenerate with `npm run images`. -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'JetBrains Mono';
        font-weight: 400;
        src: url('../node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-400-normal.woff2')
          format('woff2');
      }
      @font-face {
        font-family: 'JetBrains Mono';
        font-weight: 700;
        src: url('../node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-700-normal.woff2')
          format('woff2');
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        position: relative;
        font-family: 'JetBrains Mono', monospace;
        color: #d7e3ee;
        background:
          radial-gradient(ellipse 80% 55% at 50% 110%, rgba(255, 43, 214, 0.35), transparent 70%),
          radial-gradient(ellipse 60% 40% at 80% 0%, rgba(0, 240, 255, 0.18), transparent 70%),
          #05070a;
      }
      .grid {
        position: absolute;
        left: -50%;
        right: -50%;
        bottom: 0;
        height: 80%;
        background-image:
          linear-gradient(rgba(0, 240, 255, 0.45) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 240, 255, 0.45) 1px, transparent 1px);
        background-size: 56px 56px;
        transform: perspective(500px) rotateX(58deg);
        transform-origin: bottom;
        -webkit-mask-image: linear-gradient(to top, black 0%, transparent 75%);
      }
      .scan {
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.03) 0 1px,
          transparent 1px 3px
        );
      }
      .content {
        position: absolute;
        left: 80px;
        top: 70px;
        right: 80px;
      }
      .prompt {
        font-size: 26px;
        color: #8a9bab;
      }
      .prompt b {
        color: #39ff14;
        font-weight: 700;
      }
      .prompt i {
        color: #00f0ff;
        font-style: normal;
      }
      h1 {
        margin: 26px 0 0;
        font-size: 104px;
        line-height: 1;
        letter-spacing: -2px;
        text-shadow:
          -3px 0 rgba(0, 240, 255, 0.8),
          3px 0 rgba(255, 43, 214, 0.8),
          0 0 40px rgba(0, 240, 255, 0.35);
      }
      .titles {
        margin-top: 30px;
        font-size: 34px;
        color: #00f0ff;
      }
      .titles span {
        color: #ff2bd6;
      }
      .tags {
        margin-top: 34px;
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
      }
      .tags div {
        padding: 8px 18px;
        border: 2px solid #1c2a36;
        border-radius: 999px;
        font-size: 22px;
        color: #d7e3ee;
        background: rgba(11, 16, 22, 0.85);
      }
      .cursor {
        display: inline-block;
        width: 20px;
        height: 36px;
        background: #39ff14;
        vertical-align: -6px;
        margin-left: 6px;
      }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="scan"></div>
    <div class="content">
      <div class="prompt"><b>harshit@portfolio</b>:<i>~</i>$ whoami</div>
      <h1>Harshit Soni</h1>
      <div class="titles">
        <span>&gt;</span> DevOps Engineer / SDE / Researcher<span class="cursor"></span>
      </div>
      <div class="tags">
        <div>AWS</div>
        <div>Terraform</div>
        <div>EKS</div>
        <div>Docker</div>
        <div>Spring Boot</div>
        <div>Angular</div>
      </div>
    </div>
  </body>
</html>
